<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Interactive Quiz</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap');

* {
  box-sizing: border-box;
}

body {
  font-family: 'Nunito', sans-serif;
  background: #FFE3EF;
  background-image:
    radial-gradient(circle at 15% 20%, rgba(255, 182, 217, 0.5) 0%, transparent 25%),
    radial-gradient(circle at 85% 80%, rgba(126, 217, 169, 0.35) 0%, transparent 25%),
    radial-gradient(circle at 85% 15%, rgba(255, 111, 165, 0.25) 0%, transparent 20%);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  padding-top: 40px;
  margin: 0;
}

.quiz-container {
  position: relative;
  background: #FFFFFF;
  padding: 34px 30px;
  border-radius: 28px;
  border: 4px solid #4A2E39;
  box-shadow: 6px 6px 0px #4A2E39;
  width: 400px;
  max-width: 90vw;
  animation: popIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes popIn {
  0% { transform: scale(0.85) translateY(10px); opacity: 0; }
  100% { transform: scale(1) translateY(0); opacity: 1; }
}

#muteBtn {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 3px solid #4A2E39;
  background: #FFF6FA;
  cursor: pointer;
  font-size: 15px;
  box-shadow: 2px 2px 0px #4A2E39;
  padding: 0;
}

#muteBtn:hover {
  background: #FFE3EF;
}

.progress {
  font-family: 'Fredoka', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: #FF6FA5;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 12px;
}

h2 {
  font-family: 'Fredoka', sans-serif;
  font-weight: 600;
  color: #4A2E39;
  line-height: 1.3;
}

#question {
  margin-bottom: 20px;
  font-size: 22px;
}

#startView p {
  color: #7A5C68;
  font-weight: 600;
  margin-bottom: 4px;
}

#nameInput {
  width: 100%;
  padding: 12px 14px;
  margin: 12px 0 16px;
  border: 3px solid #FFB6D9;
  border-radius: 14px;
  font-family: 'Nunito', sans-serif;
  font-size: 15px;
  font-weight: 600;
  color: #4A2E39;
  background: #FFF6FA;
  transition: 0.2s;
}

#nameInput::placeholder {
  color: #D896B5;
}

#nameInput:focus {
  outline: none;
  border-color: #FF6FA5;
  background: #ffffff;
}

.option-btn {
  display: block;
  width: 100%;
  padding: 13px 16px;
  margin: 9px 0;
  border: 3px solid #FFB6D9;
  border-radius: 16px;
  background: #FFF6FA;
  color: #4A2E39;
  cursor: pointer;
  text-align: left;
  font-family: 'Nunito', sans-serif;
  font-size: 15px;
  font-weight: 700;
  transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
  box-shadow: 3px 3px 0px #FFB6D9;
}

.option-btn:hover:not(:disabled) {
  background: #FFE3EF;
  transform: translate(-1px, -1px);
  box-shadow: 4px 4px 0px #FF6FA5;
}

.option-btn:active:not(:disabled) {
  transform: translate(2px, 2px);
  box-shadow: 1px 1px 0px #FFB6D9;
}

.option-btn.correct {
  background: #E3FBEE;
  border-color: #7ED9A9;
  box-shadow: 3px 3px 0px #7ED9A9;
  color: #2E7D53;
}

.option-btn.incorrect {
  background: #FFE1E8;
  border-color: #FF6FA5;
  box-shadow: 3px 3px 0px #FF6FA5;
  color: #C23768;
}

.option-btn:disabled {
  cursor: default;
  transform: none;
}

#resultText {
  font-size: 24px;
  margin-bottom: 8px;
}

#resultText.correct {
  color: #2E9E63;
}

#resultText.incorrect {
  color: #FF6FA5;
}

#correctAnswerText {
  color: #7A5C68;
  font-weight: 600;
  margin-bottom: 20px;
}

#scoreText {
  font-size: 16px;
  font-weight: 700;
  color: #4A2E39;
  background: #FFF0F6;
  border: 2px dashed #FFB6D9;
  border-radius: 14px;
  padding: 12px 16px;
  margin: 16px 0;
}

#startBtn, #nextBtn, #restartBtn, #questionNextBtn {
  padding: 12px 22px;
  border: 3px solid #4A2E39;
  border-radius: 16px;
  background: #FF6FA5;
  color: white;
  cursor: pointer;
  font-family: 'Fredoka', sans-serif;
  font-size: 15px;
  font-weight: 600;
  margin-top: 12px;
  box-shadow: 3px 3px 0px #4A2E39;
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}

#startBtn:hover, #nextBtn:hover, #restartBtn:hover, #questionNextBtn:hover {
  background: #FF4F94;
  transform: translate(-1px, -1px);
  box-shadow: 4px 4px 0px #4A2E39;
}

#startBtn:active, #nextBtn:active, #restartBtn:active, #questionNextBtn:active {
  transform: translate(2px, 2px);
  box-shadow: 1px 1px 0px #4A2E39;
}

#answerImage {
  width: 100%;
  max-height: 220px;
  object-fit: cover;
  border-radius: 18px;
  border: 3px solid #4A2E39;
  margin: 14px 0;
  display: none;
}

#finishText {
  font-size: 26px;
}
</style>
</head>
<body>

<div class="quiz-container">
  <button id="muteBtn">🔊</button>

  <!-- Audio elements: update these paths to match your audio/ folder -->
  <audio id="bgMusic" src="audio/background-music.mp3" loop></audio>
  <audio id="clickSound" src="audio/click.mp3"></audio>
  <audio id="correctSound" src="audio/correct.mp3"></audio>
  <audio id="wrongSound" src="audio/wrong.mp3"></audio>
  <audio id="completeSound" src="audio/complete.mp3"></audio>

  <div class="progress" id="progress"></div>

  <!-- Start View -->
  <div id="startView">
    <h2>Welcome to the Quiz! 🎉</h2>
    <p>Enter your name:</p>
    <input type="text" id="nameInput" placeholder="Your name" />
    <button id="startBtn">Start Quiz →</button>
  </div>

  <!-- Question View -->
  <div id="questionView" style="display:none;">
    <h2 id="question"></h2>
    <div class="options" id="options"></div>
    <button id="questionNextBtn" style="display:none;">Next →</button>
  </div>

  <!-- Answer View -->
  <div id="answerView" style="display:none;">
    <h2 id="resultText"></h2>
    <img id="answerImage" src="" alt="Answer image" />
    <p id="correctAnswerText"></p>
    <button id="nextBtn">Next Question →</button>
  </div>

  <!-- Finish View -->
  <div id="finishView" style="display:none;">
    <h2 id="finishText"></h2>
    <p id="scoreText"></p>
    <button id="restartBtn">🔄 Play Again</button>
  </div>
</div>

<script>
const quizData = [
  {
    question: "Do you have a girlfriend?",
    options: ["Yes", "No"],
    correct: 1,
    image: "images/photo1.jpg"
  },
  {
    question: "Which option best describe your gf",
    options: ["Nice, Simple, Boring", "Cute, Funny, Beautiful", "Ugly, Annoying, Crybaby", "Uhh No Comment"],
    correct: 1,
    image: "images/photo2.jpg"
  },
  {
    question: "What's my go-to comfort food?",
    options: ["Pizza", "Ice Cream", "Fried Chicken", "Instant Noodles"],
    correct: 0
  },
  {
    question: "How did we first meet?",
    options: ["Through friends", "School/Work", "Social Media", "Random encounter"],
    correct: 0
  },
  {
    question: "What's my biggest pet peeve?",
    options: ["Being late", "Loud chewing", "Messy rooms", "Bad drivers"],
    correct: 0
  },
  {
    question: "What's my love language?",
    options: ["Words of Affirmation", "Quality Time", "Physical Touch", "Acts of Service"],
    correct: 0
  },
  {
    question: "What's the most annoying thing your gf do?",
    options: ["Overthinking", "Taking forever to reply", "Being too clingy", "Being stubborn"],
    correct: 0
  },
  {
    question: "Favourite date?",
    options: ["Netflix and discord", "Going out for food", "Playing games", "Grocery shopping"],
    correct: 3
  }
];

const SWAP_QUESTION_INDEX = 1;
const SWAP_OPTION_A = "Cute, Funny, Beautiful";
const SWAP_OPTION_B = "Ugly, Annoying, Crybaby";

let currentQuestion = 0;
let playerName = "";
let correctCount = 0;
let wrongCount = 0;
let posA = null;
let posB = null;

const startView = document.getElementById("startView");
const questionView = document.getElementById("questionView");
const answerView = document.getElementById("answerView");
const nameInput = document.getElementById("nameInput");
const startBtn = document.getElementById("startBtn");
const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const questionNextBtn = document.getElementById("questionNextBtn");
const resultText = document.getElementById("resultText");
const correctAnswerText = document.getElementById("correctAnswerText");
const nextBtn = document.getElementById("nextBtn");
const progressEl = document.getElementById("progress");
const answerImage = document.getElementById("answerImage");
const finishView = document.getElementById("finishView");
const finishText = document.getElementById("finishText");
const scoreText = document.getElementById("scoreText");
const restartBtn = document.getElementById("restartBtn");

// ---------- Audio Engine (uses your own uploaded files) ----------
let musicOn = true;
const bgMusic = document.getElementById("bgMusic");
const clickSound = document.getElementById("clickSound");
const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");
const completeSound = document.getElementById("completeSound");

bgMusic.volume = 0.3;
clickSound.volume = 0.5;
correctSound.volume = 0.6;
wrongSound.volume = 0.6;
completeSound.volume = 0.6;

function playSound(audioEl) {
  if (!musicOn) return;
  audioEl.currentTime = 0;
  audioEl.play().catch(() => {});
}

function playClickSound()    { playSound(clickSound); }
function playCorrectSound()  { playSound(correctSound); }
function playWrongSound()    { playSound(wrongSound); }
function playCompleteSound() { playSound(completeSound); }

function startBackgroundMusic() {
  if (!musicOn) return;
  bgMusic.play().catch(() => {});
}

function stopBackgroundMusic() {
  bgMusic.pause();
  bgMusic.currentTime = 0;
}

const muteBtn = document.getElementById("muteBtn");
muteBtn.addEventListener("click", () => {
  musicOn = !musicOn;
  muteBtn.textContent = musicOn ? "🔊" : "🔇";
  if (musicOn) startBackgroundMusic();
  else stopBackgroundMusic();
});
// ---------- End Audio Engine ----------

startBtn.addEventListener("click", startQuiz);
nameInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") startQuiz();
});

function startQuiz() {
  const name = nameInput.value.trim();
  if (!name) {
    nameInput.style.borderColor = "#e53935";
    nameInput.placeholder = "Please enter your name!";
    return;
  }
  playerName = name;
  startView.style.display = "none";
  startBackgroundMusic();
  loadQuestion();
}

function loadQuestion() {
  questionView.style.display = "block";
  answerView.style.display = "none";
  questionNextBtn.style.display = "none";

  const q = quizData[currentQuestion];
  progressEl.textContent = `${playerName} — Question ${currentQuestion + 1} of ${quizData.length}`;
  questionEl.textContent = q.question;
  optionsEl.innerHTML = "";

  if (currentQuestion === SWAP_QUESTION_INDEX) {
    posA = q.options.indexOf(SWAP_OPTION_A);
    posB = q.options.indexOf(SWAP_OPTION_B);
  }

  q.options.forEach((option, index) => {
    const btn = document.createElement("button");
    btn.textContent = option;
    btn.className = "option-btn";
    btn.addEventListener("click", () => {
      playClickSound();
      selectAnswer(index);
    });
    optionsEl.appendChild(btn);
  });
}

function selectAnswer(selectedIndex) {
  if (currentQuestion === SWAP_QUESTION_INDEX) {
    handleSwapAnswer(selectedIndex);
    return;
  }

  const q = quizData[currentQuestion];
  const isCorrect = selectedIndex === q.correct;

  if (isCorrect) {
    correctCount++;
  } else {
    wrongCount++;
  }

  showAnswerView(isCorrect, q.options[q.correct], q.image);
  nextBtn.textContent = currentQuestion === quizData.length - 1 ? "Finish" : "Next Question →";
}

function handleSwapAnswer(selectedIndex) {
  const q = quizData[SWAP_QUESTION_INDEX];
  const buttons = document.querySelectorAll("#options .option-btn");
  let isCorrect = false;

  if (selectedIndex === posA) {
    q.options[posA] = SWAP_OPTION_B;
    q.options[posB] = SWAP_OPTION_A;
    buttons[posA].textContent = SWAP_OPTION_B;
    buttons[posB].textContent = SWAP_OPTION_A;

    const temp = posA;
    posA = posB;
    posB = temp;

    isCorrect = false;
    buttons[selectedIndex].classList.add("incorrect");
  } else if (selectedIndex === posB) {
    q.options[posB] = SWAP_OPTION_A;
    q.options[posA] = SWAP_OPTION_B;
    buttons[posB].textContent = SWAP_OPTION_A;
    buttons[posA].textContent = SWAP_OPTION_B;

    const temp = posA;
    posA = posB;
    posB = temp;

    isCorrect = true;
    buttons[selectedIndex].classList.add("correct");
  } else {
    isCorrect = false;
    buttons[selectedIndex].classList.add("incorrect");
  }

  buttons.forEach((btn) => (btn.disabled = true));
  questionNextBtn.dataset.correct = isCorrect;
  questionNextBtn.style.display = "inline-block";
}

questionNextBtn.addEventListener("click", () => {
  playClickSound();
  const q = quizData[SWAP_QUESTION_INDEX];
  const isCorrect = questionNextBtn.dataset.correct === "true";

  if (isCorrect) {
    correctCount++;
  } else {
    wrongCount++;
  }

  showAnswerView(isCorrect, SWAP_OPTION_A, q.image);
  nextBtn.textContent = "Next Question →";
});

function showAnswerView(isCorrect, correctAnswerLabel, image) {
  questionView.style.display = "none";
  answerView.style.display = "block";

  isCorrect ? playCorrectSound() : playWrongSound();

  resultText.textContent = isCorrect ? "✅ Correct!" : "❌ Wrong!";
  resultText.className = isCorrect ? "correct" : "incorrect";
  correctAnswerText.textContent = `The correct answer was: "${correctAnswerLabel}"`;

  if (image) {
    answerImage.src = image;
    answerImage.style.display = "block";
  } else {
    answerImage.style.display = "none";
  }
}

nextBtn.addEventListener("click", () => {
  playClickSound();
  if (currentQuestion < quizData.length - 1) {
    currentQuestion++;
    loadQuestion();
  } else {
    answerView.style.display = "none";
    finishView.style.display = "block";
    finishText.textContent = `🎉 Nice work, ${playerName}!`;
    scoreText.textContent = `You got ${correctCount} correct and ${wrongCount} wrong out of ${quizData.length} questions.`;
    progressEl.textContent = "";
    stopBackgroundMusic();
    playCompleteSound();
  }
});

restartBtn.addEventListener("click", () => {
  playClickSound();
  currentQuestion = 0;
  playerName = "";
  correctCount = 0;
  wrongCount = 0;
  nameInput.value = "";
  nameInput.style.borderColor = "#ddd";
  nameInput.placeholder = "Your name";

  finishView.style.display = "none";
  startView.style.display = "block";
  startBackgroundMusic();
});
</script>

</body>
</html>
